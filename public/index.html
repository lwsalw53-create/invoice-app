<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvoiceFlow Dashboard</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <style>body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}</style>
  </head>
  <body>
    <div id="authView" class="app-layout auth-card">
      <div class="card">
        <div class="brand" style="margin-bottom:1rem">
          <h1>InvoiceFlow</h1>
          <p>Modern invoice workspace for customers, products, and billing.</p>
        </div>
        <div class="auth-grid">
          <form id="registerForm" class="form">
            <h2>Create account</h2>
            <input name="name" placeholder="Full name" required />
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Password" required />
            <button class="btn-primary" type="submit">Register</button>
          </form>
          <form id="loginForm" class="form">
            <h2>Sign in</h2>
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Password" required />
            <button class="btn-primary" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>

    <div id="dashboardView" class="app-layout" style="display:none">
      <header class="topbar">
        <div class="brand">
          <h1>InvoiceFlow Dashboard</h1>
          <p>Manage clients, catalog, and invoicing from one place.</p>
        </div>
        <button id="logoutBtn" class="btn-danger" type="button">Logout</button>
      </header>

      <section class="kpis">
        <div class="kpi"><div class="label">Customers</div><div id="kpiCustomers" class="value">0</div></div>
        <div class="kpi"><div class="label">Products</div><div id="kpiProducts" class="value">0</div></div>
        <div class="kpi"><div class="label">Invoices</div><div id="kpiInvoices" class="value">0</div></div>
        <div class="kpi"><div class="label">Revenue</div><div id="kpiRevenue" class="value">$0.00</div></div>
      </section>

      <section class="dashboard-grid">
        <div class="card split">
          <h2>Customers</h2>
          <form id="customerForm" class="form">
            <input name="name" placeholder="Name" required />
            <input name="email" placeholder="Email" />
            <input name="phone" placeholder="Phone" />
            <input name="address" placeholder="Address" />
            <button class="btn-primary" type="submit">Add customer</button>
          </form>
          <ul id="customerList" class="list" style="margin-top:.8rem"></ul>
        </div>

        <div class="card split">
          <h2>Products</h2>
          <form id="productForm" class="form">
            <input name="name" placeholder="Name" required />
            <input name="description" placeholder="Description" />
            <input name="unit_price" type="number" step="0.01" placeholder="Unit price" required />
            <input name="tax_rate" type="number" step="0.01" placeholder="Tax rate %" />
            <button class="btn-primary" type="submit">Add product</button>
          </form>
          <ul id="productList" class="list" style="margin-top:.8rem"></ul>
        </div>

        <div class="card wide">
          <h2>Create Invoice</h2>
          <form id="invoiceForm" class="form">
            <input name="invoice_number" placeholder="Invoice number" required />
            <select name="customer_id" id="invoiceCustomer" required><option value="">Select customer</option></select>
            <input name="issue_date" type="date" required />
            <input name="due_date" type="date" required />
            <textarea name="notes" placeholder="Notes"></textarea>
            <textarea name="items" required>[{"description":"Consulting","quantity":1,"unit_price":500,"tax_rate":10}]</textarea>
            <button class="btn-primary" type="submit">Create invoice</button>
          </form>
        </div>

        <div class="card wide">
          <h2>Invoices</h2>
          <ul id="invoiceList" class="list"></ul>
        </div>
      </section>
    </div>

    <div id="toast" class="app-layout toast" style="display:none"></div>

    <script src="./js/app.js"></script>
  </body>
</html>
