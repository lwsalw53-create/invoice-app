<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Management</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Invoice Management System</h1>
      <button id="logoutBtn" class="hidden">Logout</button>
    </header>

    <main>
      <section id="authSection" class="card">
        <h2>Authentication</h2>
        <div class="grid">
          <form id="registerForm">
            <h3>Register</h3>
            <input name="name" placeholder="Name" required />
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Password" required />
            <button type="submit">Register</button>
          </form>

          <form id="loginForm">
            <h3>Login</h3>
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Password" required />
            <button type="submit">Login</button>
          </form>
        </div>
      </section>

      <section id="appSection" class="hidden">
        <section class="card">
          <h2>Customers</h2>
          <form id="customerForm" class="inline-form">
            <input name="name" placeholder="Customer Name" required />
            <input name="email" placeholder="Email" />
            <input name="phone" placeholder="Phone" />
            <input name="address" placeholder="Address" />
            <button type="submit">Add Customer</button>
          </form>
          <ul id="customerList"></ul>
        </section>

        <section class="card">
          <h2>Products</h2>
          <form id="productForm" class="inline-form">
            <input name="name" placeholder="Product Name" required />
            <input name="description" placeholder="Description" />
            <input name="unit_price" type="number" step="0.01" placeholder="Unit Price" required />
            <input name="tax_rate" type="number" step="0.01" placeholder="Tax %" />
            <button type="submit">Add Product</button>
          </form>
          <ul id="productList"></ul>
        </section>

        <section class="card">
          <h2>Create Invoice</h2>
          <form id="invoiceForm">
            <input name="invoice_number" placeholder="Invoice Number" required />
            <label>Issue Date <input name="issue_date" type="date" required /></label>
            <label>Due Date <input name="due_date" type="date" required /></label>
            <select name="customer_id" id="invoiceCustomerSelect" required></select>
            <textarea name="notes" placeholder="Notes"></textarea>
            <label>Items (JSON array)</label>
            <textarea name="items" required>[{"description":"Sample item","quantity":1,"unit_price":100,"tax_rate":10}]</textarea>
            <button type="submit">Create Invoice</button>
          </form>
          <ul id="invoiceList"></ul>
        </section>
      </section>

      <p id="message"></p>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
